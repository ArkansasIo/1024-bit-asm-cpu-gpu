name: arkan10000-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpp23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpu10000 -B build/cpu10000 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cpu10000 --parallel 2
      - name: Unit tests
        run: ctest --test-dir build/cpu10000 --output-on-failure

  python-program-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GPU reference model unit tests
        run: python -m unittest discover -s tools -p 'test_arkan_gpu.py' -v
      - name: Generate and execute 10,000 programs
        run: python tools/validate_programs.py --count 10000 --out /tmp/arkan10000-programs
      - name: Check corpus size
        run: test "$(find /tmp/arkan10000-programs -maxdepth 1 -name 'program_*.asm' | wc -l)" -eq 10000

  asm-rtl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host assembler and RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm iverilog
      - name: Assemble x86-64 helper
        run: nasm -f elf64 asm/x86_64/u64_add_carry.asm -o /tmp/u64_add_carry.o
      - name: Elaborate 10000-bit CPU register file
        run: iverilog -g2012 -s arkan10000_regfile -o /tmp/arkan10000_regfile.vvp hardware/rtl/arkan10000_regfile.sv
      - name: Elaborate 10000-bit GPU lane
        run: iverilog -g2012 -s arkan10000_gpu_lane -o /tmp/arkan10000_gpu_lane.vvp hardware/rtl/arkan10000_gpu_lane.sv
